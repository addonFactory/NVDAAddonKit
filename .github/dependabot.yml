version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Template workflows are payloads written into generated add-ons, not this
    # repository's own CI, so they are updated deliberately rather than by bot.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
